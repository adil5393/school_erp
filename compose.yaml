services:
  db:
    image: postgres:17
    container_name: school-erp-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: school_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: school-erp-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

    volumes:
      - ./backend:/app

volumes:
  postgres_data: